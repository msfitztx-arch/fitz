<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Links</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Links">
<meta name="theme-color" content="#0f0c29">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --bg1: #f6f1ff; --bg2: #ffe9f3; --bg3: #e6f4ff;
    --card: rgba(255,255,255,.62); --card-border: rgba(255,255,255,.85);
    --text: #1d1530; --muted: #6f6585; --shadow: 0 8px 30px rgba(60,30,110,.12);
    --sheet: #ffffff; --input: #f3f0f8; --danger: #e5484d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg1: #0f0c29; --bg2: #2b1a4a; --bg3: #102a43;
      --card: rgba(255,255,255,.08); --card-border: rgba(255,255,255,.14);
      --text: #f4f0ff; --muted: #a79fc0; --shadow: 0 8px 30px rgba(0,0,0,.35);
      --sheet: #1c1830; --input: #2a2542;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "SF Pro Display", system-ui, sans-serif;
    color: var(--text);
    background: var(--bg1);
    background-image:
      radial-gradient(60vmax 60vmax at 0% 0%, var(--bg2), transparent 60%),
      radial-gradient(60vmax 60vmax at 100% 100%, var(--bg3), transparent 60%);
    background-attachment: fixed;
    padding: calc(env(safe-area-inset-top) + 28px) 20px calc(env(safe-area-inset-bottom) + 32px);
    -webkit-user-select: none; user-select: none;
  }
  .wrap { max-width: 520px; margin: 0 auto; }
  header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 18px; }
  .greet { font-size: 15px; color: var(--muted); font-weight: 500; }
  h1 { margin: 2px 0 0; font-size: 30px; letter-spacing: -.02em; font-weight: 800; }
  .edit-btn {
    border: 0; background: var(--card); color: var(--text); font-family: inherit; font-size: 15px; font-weight: 600;
    padding: 9px 16px; border-radius: 999px; border: 1px solid var(--card-border);
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .tile { min-width: 0;
    position: relative; display: flex; flex-direction: row; align-items: center; gap: 10px;
    padding: 10px; border-radius: 18px; text-decoration: none; color: var(--text);
    background: var(--card); border: 1px solid var(--card-border); box-shadow: var(--shadow);
    -webkit-backdrop-filter: blur(24px) saturate(160%); backdrop-filter: blur(24px) saturate(160%);
    transition: transform .18s cubic-bezier(.2,.8,.2,1);
    animation: pop .45s cubic-bezier(.2,.8,.2,1) both;
  }
  .tile:active { transform: scale(.96); }
  .tile > div:last-child { min-width: 0; flex: 1; }
  .icon {
    flex: 0 0 auto; width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; font-size: 21px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 6px 16px rgba(0,0,0,.15);
  }
  .label { font-size: 15px; font-weight: 700; letter-spacing: -.01em; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sub { font-size: 11px; color: var(--muted); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile.add { justify-content: center; min-height: 60px; border-style: dashed; color: var(--muted); font-family: inherit; font-size: 15px; font-weight: 600; gap: 6px; }
  .tile.add span { font-size: 22px; line-height: 1; }
  .editing .tile:not(.add) { animation: wiggle .28s ease-in-out infinite alternate; }
  .editing .tile:nth-child(even):not(.add) { animation-delay: .14s; }
  .badge {
    position: absolute; top: -6px; left: -6px; width: 22px; height: 22px; border-radius: 50%;
    background: var(--danger); color: #fff; border: 2px solid var(--sheet); display: none;
    place-items: center; font-size: 16px; font-weight: 700; line-height: 1;
  }
  .editing .badge { display: grid; }
  @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.96); } }
  @keyframes wiggle { from { transform: rotate(-1.2deg); } to { transform: rotate(1.2deg); } }

  /* Sheet */
  .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.35); opacity: 0; pointer-events: none; transition: opacity .25s; }
  .backdrop.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; max-width: 520px; margin: 0 auto;
    background: var(--sheet); border-radius: 24px 24px 0 0; padding: 10px 20px calc(env(safe-area-inset-bottom) + 20px);
    transform: translateY(105%); transition: transform .32s cubic-bezier(.2,.8,.2,1);
    -webkit-user-select: text; user-select: text;
  }
  .sheet.open { transform: none; }
  .grabber { width: 40px; height: 5px; border-radius: 3px; background: var(--muted); opacity: .35; margin: 0 auto 14px; }
  .sheet h2 { margin: 0 0 14px; font-size: 20px; }
  .sheet label { display: block; font-size: 13px; color: var(--muted); font-weight: 600; margin: 12px 0 6px; }
  .sheet input {
    width: 100%; border: 0; background: var(--input); color: var(--text); font-family: inherit; font-size: 17px;
    padding: 13px 14px; border-radius: 12px; outline: none;
  }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  .swatches { display: flex; gap: 10px; flex-wrap: wrap; }
  .swatch { width: 34px; height: 34px; border-radius: 50%; border: 3px solid transparent; }
  .swatch.on { border-color: var(--text); }
  .actions { display: flex; gap: 10px; margin-top: 20px; }
  .actions button { flex: 1; border: 0; padding: 15px; border-radius: 14px; font-family: inherit; font-size: 17px; font-weight: 600; }
  .primary { background: linear-gradient(135deg, #7b5cff, #ff5ca8); color: #fff; }
  .secondary { background: var(--input); color: var(--text); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="greet" id="greet"></div>
      <h1>Fitz</h1>
    </div>
    <button class="edit-btn" id="editBtn">Edit</button>
  </header>
  <main class="grid" id="grid"></main>
</div>

<div class="backdrop" id="backdrop"></div>
<form class="sheet" id="sheet" autocomplete="off">
  <div class="grabber"></div>
  <h2 id="sheetTitle">New button</h2>
  <div class="row">
    <div style="flex:0 0 76px"><label>Emoji</label><input id="fEmoji" maxlength="4" required></div>
    <div><label>Title</label><input id="fTitle" required></div>
  </div>
  <label>Link</label>
  <input id="fUrl" type="url" inputmode="url" placeholder="https://" required>
  <label>Color</label>
  <div class="swatches" id="swatches"></div>
  <div class="actions">
    <button type="button" class="secondary" id="cancel">Cancel</button>
    <button type="submit" class="primary">Save</button>
  </div>
</form>

<script>
// ✏️ Default buttons — edit these, or use the in-app Edit button on your phone.
const DEFAULT_LINKS = [
  { emoji: "📧", title: "Mail",     url: "mailto:",                         color: 0 },
  { emoji: "📅", title: "Calendar", url: "https://calendar.google.com",     color: 1 },
  { emoji: "📁", title: "Drive",    url: "https://drive.google.com",        color: 2 },
  { emoji: "✅", title: "Todoist",  url: "https://app.todoist.com",         color: 3 },
  { emoji: "📝", title: "Notion",   url: "https://www.notion.so",           color: 4 },
  { emoji: "✨", title: "Claude",   url: "https://claude.ai",               color: 5 },
];

const GRADIENTS = [
  ["#7b5cff", "#b78cff"], ["#ff5ca8", "#ff9a8b"], ["#2ec5ff", "#5b8cff"],
  ["#22c55e", "#a3e635"], ["#ff9f1c", "#ffd166"], ["#14b8a6", "#67e8f9"],
  ["#f43f5e", "#fb7185"], ["#475569", "#94a3b8"],
];
const KEY = "linkhub.links.v1";

let links = load();
let editing = false;
let editIndex = -1;
let pickedColor = 0;

function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (Array.isArray(s)) return s; } catch {}
  return DEFAULT_LINKS.slice();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(links)); } catch {} }
const grad = i => { const [a, b] = GRADIENTS[i % GRADIENTS.length]; return `linear-gradient(135deg, ${a}, ${b})`; };
const host = u => {
  if (/^mailto:/i.test(u)) return "Email";
  if (/^(tel|sms):/i.test(u)) return "Phone";
  try { return new URL(u).hostname.replace(/^www\./, "") || u; } catch { return u; }
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function render() {
  const grid = document.getElementById("grid");
  grid.classList.toggle("editing", editing);
  grid.innerHTML = links.map((l, i) => `
    <a class="tile" href="${esc(l.url)}" data-i="${i}" style="animation-delay:${i * 40}ms">
      <div class="badge" data-del="${i}">−</div>
      <div class="icon" style="background:${grad(l.color)}">${esc(l.emoji)}</div>
      <div><div class="label">${esc(l.title)}</div><div class="sub">${esc(host(l.url))}</div></div>
    </a>`).join("") + (editing ? `<button class="tile add" id="addTile"><span>+</span>Add</button>` : "");
  document.getElementById("editBtn").textContent = editing ? "Done" : "Edit";
}

document.getElementById("grid").addEventListener("click", e => {
  const del = e.target.closest("[data-del]");
  if (del) { e.preventDefault(); links.splice(+del.dataset.del, 1); save(); render(); return; }
  if (e.target.closest("#addTile")) { openSheet(-1); return; }
  const tile = e.target.closest(".tile[data-i]");
  if (tile && editing) { e.preventDefault(); openSheet(+tile.dataset.i); }
});

document.getElementById("editBtn").onclick = () => { editing = !editing; render(); };

function openSheet(i) {
  editIndex = i;
  const l = links[i] || { emoji: "🔗", title: "", url: "", color: links.length % GRADIENTS.length };
  document.getElementById("sheetTitle").textContent = i < 0 ? "New button" : "Edit button";
  fEmoji.value = l.emoji; fTitle.value = l.title; fUrl.value = l.url; pickedColor = l.color;
  drawSwatches();
  backdrop.classList.add("open"); sheet.classList.add("open");
}
function closeSheet() { backdrop.classList.remove("open"); sheet.classList.remove("open"); }
function drawSwatches() {
  swatches.innerHTML = GRADIENTS.map((_, i) =>
    `<button type="button" class="swatch${i === pickedColor ? " on" : ""}" data-c="${i}" style="background:${grad(i)}"></button>`).join("");
}
swatches.onclick = e => { const s = e.target.closest("[data-c]"); if (s) { pickedColor = +s.dataset.c; drawSwatches(); } };
backdrop.onclick = closeSheet;
document.getElementById("cancel").onclick = closeSheet;
sheet.onsubmit = e => {
  e.preventDefault();
  const item = { emoji: fEmoji.value.trim() || "🔗", title: fTitle.value.trim(), url: fUrl.value.trim(), color: pickedColor };
  if (editIndex < 0) links.push(item); else links[editIndex] = item;
  save(); closeSheet(); render();
};

const h = new Date().getHours();
document.getElementById("greet").textContent = h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
render();
</script>
</body>
</html>
